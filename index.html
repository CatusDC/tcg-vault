<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Vault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- =========================
     HOME
========================= -->
<div id="homePage">

    <h1>🎴 TCG Vault</h1>

    <div id="gameCards"></div>

</div>

<!-- =========================
     COLLECTION
========================= -->
<div id="collectionPage" class="hidden">

    <button id="homeButton">← Home</button>

    <h2 id="gameTitle"></h2>

    <!-- FILTERS -->
    <div id="filtersPanel">
    
        <!-- RIGA 1: SEARCH -->
        <div class="filterRow">
            <input type="text" id="searchBox" placeholder="Search name / tag">
        </div>
    
        <!-- RIGA 2: SET -->
        <div class="filterRow">
            <div id="setFilter" class="chipGroup"></div>
        </div>
    
        <!-- RIGA 3: RARITY -->
        <div class="filterRow">
            <div id="rarityFilter" class="chipGroup"></div>
        </div>
    
        <!-- RIGA 4: CHECKBOX -->
        <div class="filterRow checkboxRow">
    
            <label><input type="checkbox" id="hideV1"> Hide V1 complete</label>
            <label><input type="checkbox" id="hideV2"> Hide V2 complete</label>
            <label><input type="checkbox" id="hideV3"> Hide V3 complete</label>
    
        </div>
    
    </div>

    <div id="tableContainer" class="tableWrapper"></div>

</div>

<script src="app.js"></script>

</body>
</html>
