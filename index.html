<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>TCG Vault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- =========================
         HOME PAGE
    ========================= -->
    <main id="homePage">
        <header>
            <h1>🎴 TCG Vault</h1>
        </header>
        <section id="gameCards"></section>
    </main>

    <!-- =========================
         COLLECTION PAGE
    ========================= -->
    <div id="collectionPage" class="hidden">
        <nav class="navigation-bar">
            <button id="homeButton">← Home</button>
        </nav>
        
        <header>
            <h2 id="gameTitle"></h2>
        </header>

        <!-- DASHBOARD STATISTICHE DINAMICHE -->
        <section id="statsPanel" class="stats-container">
            <div class="stat-card">
                <span class="stat-label">Visibili / Totali</span>
                <span id="statCount" class="stat-value">- / -</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Completamento V1</span>
                <span id="statV1" class="stat-value">-</span>
                <div class="progress-bar-container"><div id="barV1" class="progress-bar"></div></div>
            </div>
            <div class="stat-card">
                <span class="stat-label">Completamento V2</span>
                <span id="statV2" class="stat-value">-</span>
                <div class="progress-bar-container"><div id="barV2" class="progress-bar"></div></div>
            </div>
            <div class="stat-card">
                <span class="stat-label">Completamento V3</span>
                <span id="statV3" class="stat-value">-</span>
                <div class="progress-bar-container"><div id="barV3" class="progress-bar"></div></div>
            </div>
        </section>

        <!-- FILTERS -->
        <aside id="filtersPanel">
            <!-- RIGA 1: SEARCH -->
            <div class="filterRow">
                <input type="text" id="searchBox" placeholder="Cerca nome / tag">
            </div>
            <!-- RIGA 2: SET (Scorrevole orizzontalmente) -->
            <div class="filterRow scrollableRow">
                <div id="setFilter" class="chipGroup"></div>
            </div>
            <!-- RIGA 3: RARITY (Scorrevole orizzontalmente) -->
            <div class="filterRow scrollableRow">
                <div id="rarityFilter" class="chipGroup"></div>
            </div>
            <!-- RIGA 4: CHECKBOX -->
            <div class="filterRow checkboxRow">
                <div class="checkboxItem">
                    <input type="checkbox" id="hideV1">
                    <label for="hideV1">Nascondi V1 completati</label>
                </div>
                <div class="checkboxItem">
                    <input type="checkbox" id="hideV2">
                    <label for="hideV2">Nascondi V2 completati</label>
                </div>
                <div class="checkboxItem">
                    <input type="checkbox" id="hideV3">
                    <label for="hideV3">Nascondi V3 completati</label>
                </div>
            </div>
        </aside>

        <!-- TABLE CONTAINER -->
        <section class="tableWrapper">
            <div id="tableContainer"></div>
        </section>
    </div>

    <!-- POPUP ZOOM IMMAGINE -->
    <div id="imageModal" class="modal hidden">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <script src="app.js"></script>
</body>
</html>
