<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Vault</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
     HOME PAGE
========================= -->
<div id="homePage">

    <h1>🎴 TCG Vault</h1>

    <div id="gameCards"></div>

</div>

<!-- =========================
     COLLECTION PAGE
========================= -->
<div id="collectionPage" class="hidden">

    <header class="topBar">
        <button id="homeButton">← Home</button>
        <h2 id="gameTitle"></h2>
    </header>

    <!-- FILTERS -->
    <div class="filters">

        <input type="text" id="searchBox" placeholder="Ricerca nome o tag">

        <select id="rarityFilter">
            <option value="All">Rarità: All</option>
        </select>

        <select id="setFilter">
            <option value="All">Set: All</option>
        </select>

    </div>

    <!-- V1 / V2 / V3 FILTERS -->
    <div class="filters">

        <label>
            <input type="checkbox" id="hideV1">
            Nascondi V1 complete
        </label>

        <label>
            <input type="checkbox" id="hideV2">
            Nascondi V2 complete
        </label>

        <label>
            <input type="checkbox" id="hideV3">
            Nascondi V3 complete
        </label>

    </div>

    <!-- TABLE -->
    <div id="tableContainer"></div>

</div>

<!-- =========================
     SCRIPT
========================= -->
<script src="app.js"></script>

</body>
</html>
